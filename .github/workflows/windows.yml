# Fabrique la version Windows d'Admiral sur un serveur Windows de GitHub, la vérifie
# et la met à disposition (onglet Actions > dernière exécution > Artifacts) :
#   Admiral_validation_client : l'exe avec des données de démonstration ;
#   Admiral_exe : l'exe seul, pour le dossier client préparé par preparer_livraison.py.
name: Exécutable Windows

on:
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Tests automatiques (sous Windows)
        # Chaque échec devient une annotation, lisible sans connexion (le journal complet demande d'être connecté)
        run: python .github/lancer_tests.py

      - name: Fabrication de Admiral.exe
        run: python -m PyInstaller --noconfirm --clean admiral.spec

      - name: Dossier client avec les données de démonstration
        shell: pwsh
        run: |
          $sortie = "dist/Admiral_validation_client"
          New-Item -ItemType Directory -Force $sortie | Out-Null
          Copy-Item dist/Admiral.exe $sortie
          python -m admiral.demo $sortie
          Copy-Item LISEZMOI_CLIENT.txt "$sortie/LISEZMOI.txt"

      - name: Auto-vérification de l'exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Admiral_validation_client/Admiral.exe" -ArgumentList "--autotest" -Wait -PassThru
          Get-Content dist/Admiral_validation_client/logs/admiral.log
          if ($p.ExitCode -ne 0) { throw "Auto-vérification échouée (code $($p.ExitCode))" }
          Remove-Item -Recurse -Force dist/Admiral_validation_client/logs

      - uses: actions/upload-artifact@v4
        with:
          name: Admiral_validation_client
          path: dist/Admiral_validation_client
          retention-days: 30

      # Pour la livraison avec les vraies données : l'exe vérifié ci-dessus et le mode d'installation,
      # à glisser dans le dossier préparé par preparer_livraison.py (les données ne sont jamais ici)
      - name: Exécutable seul pour la livraison client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Admiral_exe | Out-Null
          Copy-Item dist/Admiral.exe dist/Admiral_exe
          Copy-Item LISEZMOI_INSTALLATION.txt dist/Admiral_exe/LISEZMOI.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Admiral_exe
          path: dist/Admiral_exe
          retention-days: 90
